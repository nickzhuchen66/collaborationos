<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">CollaborationOS system architecture</title>
  <desc id="desc">A host-owned business system adopts the five-layer CollaborationOS public core by reference without transferring host payloads or authority.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#26334A" stroke-width="1" opacity="0.28"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#61D7D0"/>
    </marker>
    <marker id="arrowBack" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M10,0 L0,5 L10,10 Z" fill="#61D7D0"/>
    </marker>
  </defs>

  <rect width="1440" height="820" fill="#0B1020"/>
  <rect width="1440" height="820" fill="url(#grid)"/>

  <rect x="64" y="48" width="8" height="86" rx="4" fill="#61D7D0"/>
  <text x="94" y="72" fill="#61D7D0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">COLLABORATIONOS / SYSTEM ARCHITECTURE</text>
  <text x="94" y="108" fill="#F4F7FB" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700">Governance core outside the host business system</text>
  <text x="94" y="136" fill="#9FB0C7" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">Adopt by reference. Keep data, execution, permissions, and final decisions host-owned.</text>

  <rect x="64" y="190" width="356" height="484" rx="8" fill="#121A2B" stroke="#33425D" stroke-width="2"/>
  <rect x="88" y="214" width="116" height="28" rx="6" fill="#1F3C39"/>
  <text x="146" y="233" text-anchor="middle" fill="#77D196" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">HOST-OWNED</text>
  <text x="88" y="282" fill="#F4F7FB" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="700">Host project</text>
  <text x="88" y="310" fill="#9FB0C7" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">The operational and business authority boundary</text>

  <rect x="88" y="342" width="308" height="60" rx="8" fill="#182338" stroke="#2A3853"/>
  <rect x="106" y="361" width="6" height="22" rx="3" fill="#6EA8FE"/>
  <text x="128" y="367" fill="#F4F7FB" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">Business source of truth</text>
  <text x="128" y="388" fill="#9FB0C7" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">facts, state, domain records</text>

  <rect x="88" y="416" width="308" height="60" rx="8" fill="#182338" stroke="#2A3853"/>
  <rect x="106" y="435" width="6" height="22" rx="3" fill="#F2C66D"/>
  <text x="128" y="441" fill="#F4F7FB" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">Domain data and ontology</text>
  <text x="128" y="462" fill="#9FB0C7" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">payloads stay outside COS core</text>

  <rect x="88" y="490" width="308" height="60" rx="8" fill="#182338" stroke="#2A3853"/>
  <rect x="106" y="509" width="6" height="22" rx="3" fill="#F08A8A"/>
  <text x="128" y="515" fill="#F4F7FB" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">Permissions and execution</text>
  <text x="128" y="536" fill="#9FB0C7" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">access, tools, writes, external calls</text>

  <rect x="88" y="564" width="308" height="60" rx="8" fill="#182338" stroke="#2A3853"/>
  <rect x="106" y="583" width="6" height="22" rx="3" fill="#B69AF8"/>
  <text x="128" y="589" fill="#F4F7FB" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">Final human decisions</text>
  <text x="128" y="610" fill="#9FB0C7" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">acceptance, takeover, promotion</text>

  <text x="454" y="503" transform="rotate(-90 454 503)" fill="#71839D" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">REFERENCE BOUNDARY</text>

  <rect x="500" y="170" width="876" height="568" rx="8" fill="#121A2B" stroke="#33425D" stroke-width="2"/>
  <rect x="524" y="194" width="108" height="28" rx="6" fill="#17384A"/>
  <text x="578" y="213" text-anchor="middle" fill="#61D7D0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">PUBLIC CORE</text>
  <text x="652" y="214" fill="#F4F7FB" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">Stable governance semantics</text>

  <g>
    <rect x="548" y="246" width="780" height="72" rx="8" fill="#182338" stroke="#2A3853"/>
    <rect x="548" y="246" width="8" height="72" rx="4" fill="#B69AF8"/>
    <text x="584" y="291" fill="#B69AF8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">01</text>
    <text x="634" y="278" fill="#F4F7FB" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">Governance</text>
    <text x="634" y="300" fill="#9FB0C7" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Public Constitution and invariants</text>
    <text x="1050" y="290" text-anchor="middle" fill="#D7DEEA" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">human authority · default deny</text>
  </g>

  <g>
    <rect x="548" y="330" width="780" height="72" rx="8" fill="#182338" stroke="#2A3853"/>
    <rect x="548" y="330" width="8" height="72" rx="4" fill="#6EA8FE"/>
    <text x="584" y="375" fill="#6EA8FE" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">02</text>
    <text x="634" y="362" fill="#F4F7FB" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">Protocols</text>
    <text x="634" y="384" fill="#9FB0C7" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">P01-P07 ordered collaboration contracts</text>
    <text x="1050" y="374" text-anchor="middle" fill="#D7DEEA" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">context → evidence → learning</text>
  </g>

  <g>
    <rect x="548" y="414" width="780" height="72" rx="8" fill="#182338" stroke="#2A3853"/>
    <rect x="548" y="414" width="8" height="72" rx="4" fill="#F2C66D"/>
    <text x="584" y="459" fill="#F2C66D" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">03</text>
    <text x="634" y="446" fill="#F4F7FB" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">Artifacts</text>
    <text x="634" y="468" fill="#9FB0C7" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">A01-A09 strict schemas and human templates</text>
    <text x="1050" y="458" text-anchor="middle" fill="#D7DEEA" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">machine-readable · reviewable</text>
  </g>

  <g>
    <rect x="548" y="498" width="780" height="72" rx="8" fill="#182338" stroke="#2A3853"/>
    <rect x="548" y="498" width="8" height="72" rx="4" fill="#77D196"/>
    <text x="584" y="543" fill="#77D196" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">04</text>
    <text x="634" y="530" fill="#F4F7FB" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">Conformance</text>
    <text x="634" y="552" fill="#9FB0C7" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Synthetic positive, legal-stop, and failure cases</text>
    <text x="1050" y="542" text-anchor="middle" fill="#D7DEEA" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">126 fixtures · 4 matrices</text>
  </g>

  <g>
    <rect x="548" y="582" width="780" height="72" rx="8" fill="#182338" stroke="#2A3853"/>
    <rect x="548" y="582" width="8" height="72" rx="4" fill="#61D7D0"/>
    <text x="584" y="627" fill="#61D7D0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">05</text>
    <text x="634" y="614" fill="#F4F7FB" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">Adoption</text>
    <text x="634" y="636" fill="#9FB0C7" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Manual Gate Pack and Host Adoption Kit</text>
    <text x="1050" y="626" text-anchor="middle" fill="#D7DEEA" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">pin version · map roles · retain ownership</text>
  </g>

  <path d="M396 594 H470 Q486 594 500 608 L548 618" fill="none" stroke="#61D7D0" stroke-width="2" marker-start="url(#arrowBack)" marker-end="url(#arrow)"/>
  <rect x="426" y="640" width="92" height="24" rx="6" fill="#17384A"/>
  <text x="472" y="657" text-anchor="middle" fill="#61D7D0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700">BY REFERENCE</text>

  <rect x="64" y="712" width="1352" height="54" rx="8" fill="#101827" stroke="#2A3853"/>
  <circle cx="92" cy="739" r="5" fill="#61D7D0"/>
  <text x="110" y="745" fill="#D7DEEA" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">No payload transfer</text>
  <circle cx="308" cy="739" r="5" fill="#F2C66D"/>
  <text x="326" y="745" fill="#D7DEEA" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">No silent authority</text>
  <circle cx="520" cy="739" r="5" fill="#F08A8A"/>
  <text x="538" y="745" fill="#D7DEEA" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">No automatic acceptance or retry</text>
  <text x="1328" y="745" text-anchor="end" fill="#77D196" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">HOST RETAINS BUSINESS TRUTH</text>
</svg>
