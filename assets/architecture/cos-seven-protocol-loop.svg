    <text x="280" y="355" fill="#9FB0C7" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Grounded evidence</text>
    <rect x="280" y="373" width="56" height="24" rx="6" fill="#17384A"/>
    <text x="308" y="390" text-anchor="middle" fill="#A6F0EB" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">A02</text>
  </g>

  <g>
