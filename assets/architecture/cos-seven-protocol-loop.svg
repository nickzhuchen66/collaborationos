    <text x="1210" y="546" fill="#61D7D0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">P07 · SEPARATE GATE</text>
    <text x="1210" y="577" fill="#F4F7FB" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700">Human promotion</text>
