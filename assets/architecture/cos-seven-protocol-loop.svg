  <rect x="72" y="652" width="1296" height="1" fill="#2A3853"/>
  <text x="72" y="678" fill="#71839D" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">PRIMARY PATH</text>
