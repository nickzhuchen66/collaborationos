<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="title desc">
  <title id="title">CollaborationOS seven-protocol governance loop</title>
  <desc id="desc">The ordered P01 through P07 governance path with explicit legal-stop, failure takeover, and separate promotion branches.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#26334A" stroke-width="1" opacity="0.28"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#71839D"/>
    </marker>
    <marker id="branchArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#F08A8A"/>
    </marker>
  </defs>

  <rect width="1440" height="700" fill="#0B1020"/>
  <rect width="1440" height="700" fill="url(#grid)"/>

  <rect x="64" y="48" width="8" height="86" rx="4" fill="#6EA8FE"/>
  <text x="94" y="72" fill="#6EA8FE" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">P01-P07 / GOVERNANCE PATH</text>
  <text x="94" y="108" fill="#F4F7FB" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700">Seven protocols, one inspectable authority chain</text>
  <text x="94" y="136" fill="#9FB0C7" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">Execution is not acceptance. Failure is evidence. Learning is not promotion.</text>

  <g stroke="#71839D" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M240 306 H260"/>
    <path d="M428 306 H448"/>
    <path d="M616 306 H636"/>
    <path d="M804 306 H824"/>
    <path d="M992 306 H1012"/>
    <path d="M1180 306 H1200"/>
  </g>

  <g>
    <rect x="72" y="198" width="168" height="216" rx="8" fill="#121A2B" stroke="#33425D"/>
    <rect x="72" y="198" width="168" height="7" rx="4" fill="#6EA8FE"/>
    <text x="92" y="239" fill="#6EA8FE" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">P01</text>
    <text x="92" y="276" fill="#F4F7FB" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">Context</text>
    <text x="92" y="300" fill="#F4F7FB" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">Recovery</text>
