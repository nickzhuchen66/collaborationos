  <path d="M908 414 V472 H784 V514" fill="none" stroke="#F08A8A" stroke-width="2" marker-end="url(#branchArrow)"/>
  <path d="M1096 414 V472 H1038 V514" fill="none" stroke="#F08A8A" stroke-width="2" marker-end="url(#branchArrow)"/>
  <path d="M1284 414 V514" fill="none" stroke="#61D7D0" stroke-width="2" marker-end="url(#arrow)"/>

