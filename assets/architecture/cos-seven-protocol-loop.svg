    <text x="682" y="546" fill="#F08A8A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">P05 · LEGAL STOP</text>
    <text x="682" y="577" fill="#F4F7FB" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700">No execution</text>
    <text x="682" y="600" fill="#9FB0C7" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Downstream not attempted · no retry</text>
  </g>

  <g>
    <rect x="924" y="514" width="248" height="112" rx="8" fill="#211A24" stroke="#6D3E4A"/>
    <text x="946" y="546" fill="#F08A8A" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">P06 · FAILURE / AMBIGUITY</text>
    <text x="946" y="577" fill="#F4F7FB" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700">Preserve and take over</text>
    <text x="946" y="600" fill="#9FB0C7" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">A08 records truth · human endpoint</text>
  </g>

