    <text x="280" y="239" fill="#61D7D0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">P02</text>
    <text x="280" y="276" fill="#F4F7FB" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700">Evidence</text>
