    <text x="92" y="355" fill="#9FB0C7" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Accepted context</text>
    <rect x="92" y="373" width="56" height="24" rx="6" fill="#1B3150"/>
    <text x="120" y="390" text-anchor="middle" fill="#AFCBFF" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">A01</text>
  </g>

