    <text x="468" y="355" fill="#9FB0C7" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Roles + permissions</text>
    <rect x="468" y="373" width="56" height="24" rx="6" fill="#30264D"/>
    <text x="496" y="390" text-anchor="middle" fill="#D9CAFF" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">A03</text>
  </g>

  <g>
