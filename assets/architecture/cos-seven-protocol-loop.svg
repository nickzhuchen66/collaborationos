    <text x="872" y="390" text-anchor="middle" fill="#FFC4C4" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">A06</text>
  </g>

  <g>
    <rect x="1012" y="198" width="168" height="216" rx="8" fill="#121A2B" stroke="#33425D"/>
