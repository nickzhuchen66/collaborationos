    <text x="1075" y="390" text-anchor="middle" fill="#B9F1CD" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">A07 · A08</text>
  </g>

