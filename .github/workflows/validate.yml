name: Validate public framework

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify public source bindings
        run: python3 tools/cos_wave1.py verify-bindings --cos-root .
      - name: Run Wave 1 tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
      - name: Verify repository package and links
        run: python3 scripts/verify_repository.py
